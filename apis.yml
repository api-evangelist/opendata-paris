aid: opendata-paris

name: Paris Open Data

description: Paris Open Data provides open public data from the City of Paris, offering datasets across themes such as administration, finance,
  culture, environment, mobility, and urban planning. The portal enables search, download, and reuse of data for citizens, developers, and researchers,
  fostering transparency and innovation.

